; ============================================================================
;  esp-color-detector — PlatformIO project configuration
;
;  Environments:
;    esp32dev   : ESP32 DevKit (primary target)      — HTTPS + WSS
;    esp32-s3   : ESP32-S3 DevKitC-1                  — HTTPS + WSS
;    esp32-c3   : ESP32-C3 DevKitM-1                  — HTTPS + WSS
;    esp12e     : ESP8266 / ESP-12E (NodeMCU style)   — HTTP  + WS (fallback UI)
;
;  Build examples:
;    pio run -e esp32dev
;    pio run -t upload -e esp32dev
;    pio device monitor
; ============================================================================

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
; Minify + gzip web/ into src/web_assets.h before every build.
; (A pre-generated web_assets.h is committed, so building without Python still works.)
extra_scripts = pre:tools/build_web.py

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-deprecated-declarations

; ---------------- ESP32 (primary) ----------------
; ESP32 Arduino core includes httpd, esp_https_server, mDNS, DNSServer built-in.
; No extra lib_deps needed for core features.

[env:esp32dev]
platform = espressif32@6.11.0
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 921600
build_flags = ${env.build_flags}
    -DBOARD_HAS_PSRAM=0

[env:esp32-s3]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
upload_speed = 921600
build_flags = ${env.build_flags}
    -DBOARD_HAS_PSRAM=1

[env:esp32-c3]
platform = espressif32@6.11.0
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
upload_speed = 921600
build_flags = ${env.build_flags}

; ---------------- ESP8266 / ESP-12E (secondary) ----------------
; HTTPS is impractical on the ESP8266, so this board serves plain HTTP and
; the web app automatically falls back to photo-capture + manual picker.
; Uses ESP8266WebServer (built-in) + WebSockets library for WS.

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
upload_speed = 460800
build_flags = ${env.build_flags}
    -DWEBSOCKETS_SERVER_CLIENT_MAX=4
lib_deps =
    links2004/WebSockets@2.6.1